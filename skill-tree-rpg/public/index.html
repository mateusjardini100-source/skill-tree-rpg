<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Skyrim Skill Tree Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    <div class="aurora"></div>
    <div class="container">
        <h1>🌲 ÁRVORES DE HABILIDADE 🌲</h1>
        <div id="trees-list" class="trees-grid"></div>
        <button id="admin-btn" class="admin-btn">👑 Admin</button>
    </div>

    <!-- Modal de senha da árvore -->
    <div id="tree-password-modal" class="modal">
        <div class="modal-content glass">
            <span class="close">&times;</span>
            <h2>🔐 Acesso à Árvore</h2>
            <input type="password" id="tree-password" placeholder="Senha da árvore">
            <button id="submit-tree-password">Entrar</button>
        </div>
    </div>

    <!-- Modal da árvore (visualização/edição) -->
    <div id="tree-view-modal" class="modal tree-view">
        <div class="modal-content large glass">
            <span class="close">&times;</span>
            <div id="tree-header">
                <h2 id="tree-name"></h2>
                <div class="points-display">💠 Pontos: <span id="points">0</span></div>
                <div id="editor-tools" style="display: none;">
                    <button id="toggle-connect-mode" class="tool-btn">🔗 Conectar</button>
                    <button id="cancel-connect" class="tool-btn" style="display:none;">Cancelar</button>
                    <span id="connect-status" style="margin-left: 10px;"></span>
                </div>
            </div>
            <div id="skill-canvas-container">
                <canvas id="skillCanvas" width="900" height="650"></canvas>
                <div id="canvas-tools" style="position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.5); border-radius: 8px; padding: 5px;">
                    <button id="zoom-in" class="small-btn">🔍+</button>
                    <button id="zoom-out" class="small-btn">🔍-</button>
                    <button id="reset-view" class="small-btn">⟳</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Admin (senha e painel) -->
    <div id="admin-modal" class="modal">
        <div class="modal-content glass">
            <span class="close">&times;</span>
            <h2>🔧 Painel Admin</h2>
            <input type="password" id="admin-password" placeholder="Senha do Admin">
            <button id="login-admin">Login</button>
            <div id="admin-panel" style="display: none; margin-top: 20px;">
                <h3>Gerenciar Pontos</h3>
                <button id="add-points">+5 Pontos</button>
                <button id="remove-points">-5 Pontos</button>
                <button id="reset-perks">Resetar perks</button>
                <hr>
                <h3>Árvores</h3>
                <div id="admin-trees-list"></div>
                <button id="new-tree-btn">➕ Nova Árvore</button>
                <hr>
                <h3>Perks (edição visual disponível na árvore)</h3>
                <div id="admin-perks-list"></div>
                <button id="new-perk-btn">➕ Novo Perk (posicionar depois)</button>
            </div>
        </div>
    </div>

    <!-- Modal para edição rápida de perk -->
    <div id="quick-perk-modal" class="modal">
        <div class="modal-content glass">
            <span class="close">&times;</span>
            <h3 id="quick-perk-title">Editar Perk</h3>
            <input type="text" id="quick-perk-name" placeholder="Nome">
            <textarea id="quick-perk-desc" placeholder="Descrição"></textarea>
            <input type="number" id="quick-perk-cost" placeholder="Custo">
            <select id="quick-perk-required"></select>
            <button id="save-quick-perk">Salvar</button>
            <button id="delete-quick-perk" style="background: #8b3c2a;">Excluir</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
